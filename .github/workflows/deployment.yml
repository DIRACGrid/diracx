name: Deployment

on:
  push:
    branches:
      - main
  # Re-publish an existing tag after a failed publish. Run from main (pypi env).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  schedule:
    - cron: '0 10 * * *'

# Release-producing runs (push to main, manual re-publish) share the "release"
# group and queue behind each other; the other runs get a unique group each so
# that they never queue.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'release' || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Tags created with GITHUB_TOKEN trigger no workflows, so publish happens here.
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.repository == 'DIRACGrid/diracx'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release commit, tag and GitHub release
      issues: write  # release labels
      pull-requests: write  # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: simple

  # Generate and validate the public example and upload it to the GitHub release.
  release-env:
    name: Release env asset
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the diracx.env asset to the GitHub release
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      RELEASE_UPLOAD_URL: ${{ needs.release-please.outputs.upload_url }}
    steps:
      - name: Checkout exact DIRACX release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve current canonical charts commit
        id: charts
        shell: bash
        run: |
          refs="$(git ls-remote --exit-code https://github.com/DIRACGrid/diracx-charts.git refs/heads/master)" || exit 1
          ref_pattern=$'^([0-9a-f]{40})\trefs/heads/master$'
          if [[ "$refs" =~ $ref_pattern ]]; then
            charts_sha="${BASH_REMATCH[1]}"
          else
            echo 'Expected one canonical diracx-charts master commit' >&2
            exit 1
          fi
          echo "sha=$charts_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact diracx-charts commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DIRACGrid/diracx-charts
          ref: ${{ steps.charts.outputs.sha }}
          path: diracx-charts
          persist-credentials: false
      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
          CHARTS_SHA: ${{ steps.charts.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git -C diracx-charts rev-parse HEAD)" = "$CHARTS_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .upload_url)" = "$RELEASE_UPLOAD_URL"
      - name: Generate and validate public example
        env:
          CHARTS_SHA: ${{ steps.charts.outputs.sha }}
        run: |
          python3 scripts/generate_release_env.py \
            --charts-root diracx-charts --release-tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_SHA" --charts-commit "$CHARTS_SHA" \
            --output .env
          python3 scripts/generate_release_env.py \
            --charts-root diracx-charts --release-tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_SHA" --charts-commit "$CHARTS_SHA" \
            --output .env --validate
      - name: Upload validated release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq diracx.env; then
            echo 'diracx.env already exists on this release' >&2
            exit 1
          fi
          cp .env diracx.env
          cmp .env diracx.env
          gh release upload "$RELEASE_TAG" diracx.env

  build:
    name: Build distribution 📦
    needs: release-please
    # !cancelled(): run even when release-please was skipped (PR, schedule, forks).
    if: ${{ !cancelled() && (github.event_name != 'push' || github.repository == 'DIRACGrid/diracx') }}
    runs-on: "ubuntu-latest"
    outputs:
      new-version: ${{ steps.check-tag.outputs.new-version }}
      create-release: ${{ steps.check-tag.outputs.create-release }}
    permissions:
      contents: read
    defaults:
      run:
        # We need extglob for REFERENCE_BRANCH substitution
        shell: bash -l -O extglob {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # setuptools_scm needs the release tag to compute the version.
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || '' }}
          token: ${{ github.token }}
          persist-credentials: false
      - run: |
          git fetch --prune --unshallow
          git config --global user.email "ci@diracgrid.org"
          git config --global user.name "DIRACGrid CI"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Installing dependencies
        run: |
          python -m pip install \
              build \
              python-dateutil \
              pytz \
              readme_renderer[md] \
              requests \
              setuptools_scm
      - name: Validate README for PyPI
        run: |
          python -m readme_renderer README.md -o /tmp/README.html
      - name: Extract version from tag
        id: check-tag
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          RELEASE_CREATED: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true' }}
        run: |
          set -xeuo pipefail
          if [[ "$RELEASE_CREATED" == 'true' ]]; then
            echo "Deploying release $RELEASE_TAG"
            echo "create-release=true" >> "$GITHUB_OUTPUT"
            echo "new-version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release, skipping publish"
            echo "create-release=false" >> "$GITHUB_OUTPUT"
            echo "new-version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        run: |
          for pkg_dir in $PWD/diracx-*; do
            echo "Building $pkg_dir"
            python -m build --outdir $PWD/dist $pkg_dir
          done
          # Also build the diracx metapackage
          python -m build --outdir $PWD/dist .
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diracx-whl
          path: dist/diracx*.whl
          retention-days: 5

  # Only this job can get a PyPI token; the build above runs without it.
  publish:
    name: Publish distribution 📦 to PyPI
    needs: build
    # A skipped build upstream would otherwise skip this job too.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.create-release == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diracx-whl
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package on PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Generate and upload PEP 740 attestations (build provenance) for the wheels.
          attestations: true

  docker:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push images to ghcr.io
      id-token: write          # OIDC for sigstore signing of attestations
      attestations: write      # write build-provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push services (release)
        id: build-services-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ needs.build.outputs.create-release == 'true' }}
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-services
          push: true
          tags: "ghcr.io/diracgrid/diracx/services:${{ needs.build.outputs.new-version }}"
          platforms: linux/amd64,linux/arm64
      - name: Attest services (release)
        if: ${{ needs.build.outputs.create-release == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/diracgrid/diracx/services
          subject-digest: ${{ steps.build-services-release.outputs.digest }}
          push-to-registry: true
      - name: Build and push tasks (release)
        id: build-tasks-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ needs.build.outputs.create-release == 'true' }}
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-tasks
          push: true
          tags: "ghcr.io/diracgrid/diracx/tasks:${{ needs.build.outputs.new-version }}"
          platforms: linux/amd64,linux/arm64
      - name: Attest tasks (release)
        if: ${{ needs.build.outputs.create-release == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/diracgrid/diracx/tasks
          subject-digest: ${{ steps.build-tasks-release.outputs.digest }}
          push-to-registry: true
      - name: Build and push client (release)
        id: build-client-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ needs.build.outputs.create-release == 'true' }}
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-client
          push: true
          tags: "ghcr.io/diracgrid/diracx/client:${{ needs.build.outputs.new-version }}"
          platforms: linux/amd64,linux/arm64
      - name: Attest client (release)
        if: ${{ needs.build.outputs.create-release == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/diracgrid/diracx/client
          subject-digest: ${{ steps.build-client-release.outputs.digest }}
          push-to-registry: true

      - name: Build and push services (dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-services
          push: ${{ github.event_name != 'pull_request' && github.repository == 'DIRACGrid/diracx' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx/services:dev
          platforms: linux/amd64,linux/arm64
      - name: Build and push tasks (dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-tasks
          push: ${{ github.event_name != 'pull_request' && github.repository == 'DIRACGrid/diracx' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx/tasks:dev
          platforms: linux/amd64,linux/arm64
      - name: Build and push client (dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-client
          push: ${{ github.event_name != 'pull_request' && github.repository == 'DIRACGrid/diracx' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx/client:dev
          platforms: linux/amd64,linux/arm64

  update-charts:
    name: Update Helm charts
    needs:
      - build
      - docker
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.create-release == 'true' }}
    steps:
      - name: Checkout diracx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: diracx
          persist-credentials: false
      - name: Checkout diracx-charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DIRACGrid/diracx-charts
          token: ${{ secrets.CHARTS_UPDATE_TOKEN }}
          path: diracx-charts
          persist-credentials: true

      - name: Configure Git
        run: |
          cd diracx-charts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update chart versions
        id: update-versions
        env:
          NEW_CHART_VERSION: ${{ needs.build.outputs.new-version }}
        run: |
          cd diracx-charts
          VERSION="${NEW_CHART_VERSION}"

          # Get current chart version before updating
          CURRENT_CHART_VERSION=$(grep '^version:' diracx/Chart.yaml | sed 's/version: //' | tr -d '"')

          # Use Python script to update versions
          python ../diracx/.github/workflows/update_chart_version.py \
            --charts-dir . \
            --app-version "$VERSION"

          # Get new chart version after update
          NEW_CHART_VERSION=$(grep '^version:' diracx/Chart.yaml | sed 's/version: //' | tr -d '"')

          echo "current_chart_version=$CURRENT_CHART_VERSION" >> $GITHUB_OUTPUT
          echo "new_chart_version=$NEW_CHART_VERSION" >> $GITHUB_OUTPUT
          echo "diracx_version=$VERSION" >> $GITHUB_OUTPUT
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
           working-directory: ./diracx-charts
      - name: Run pre-commit to update README
        run: |
          cd diracx-charts
          pixi run pre-commit run --all-files || true

      - name: Commit and push changes
        if: success()
        env:
          CURRENT_CHART_VERSION: ${{ steps.update-versions.outputs.current_chart_version }}
          NEW_CHART_VERSION: ${{ steps.update-versions.outputs.new_chart_version }}
          DIRACX_VERSION: ${{ steps.update-versions.outputs.diracx_version }}
        run: |
          cd diracx-charts

          # Update the diagram to reflect the updated version number
          pixi run generate-diagram

          # Stage all changes
          git add -A

          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            # Commit the changes
            git commit -m "chore: bump chart to ${NEW_CHART_VERSION} for DiracX ${DIRACX_VERSION}

            - Update appVersion to ${DIRACX_VERSION}
            - Update image tag to ${DIRACX_VERSION}
            - Bump chart version from ${CURRENT_CHART_VERSION} to ${NEW_CHART_VERSION}"

            git push origin master

            echo "✅ Successfully pushed chart version ${NEW_CHART_VERSION} and tag ${TAG_NAME}"
          else
            echo "No changes to commit"
          fi
