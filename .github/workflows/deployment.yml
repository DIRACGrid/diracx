name: Deployment

on:
  push:
    branches:
      - main
  # A release manager publishes the draft release made by release-please. That
  # creates the tag (CI is not allowed to) and starts the publish.
  release:
    types: [published]
  # Re-publish an existing tag after a failed publish. Run from main (pypi env).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  schedule:
    - cron: '0 10 * * *'

# Concurrency is set on the release-please and publish jobs only, so a publish
# waiting for approval does not hold every later push to main.
#
# Release flow: merging the release PR makes release-please create a draft
# release, with no tag. Publishing the draft triggers build, publish and docker.

permissions: {}

jobs:
  # Maintains the release PR and, once it is merged, creates the draft release
  # (see release-please-config.json).
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.repository == 'DIRACGrid/diracx'
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release commit and draft GitHub release
      issues: write  # release labels
      pull-requests: write  # open and update the release PR
    steps:
      # release-please ignores draft releases (they have no tag). Until the draft
      # for the manifest version is published it finds no release for that
      # version and proposes 1.0.0 with the whole history as changelog, so do not
      # run it in that window. This job has no checkout, so call the API
      # with an explicit repo; any API error fails the step instead of being read
      # as "no draft".
      - name: Check for an unpublished draft release
        id: pending
        # bash -eo pipefail: without pipefail a failed `gh api` in the pipeline
        # below is hidden by jq, which exits 0 on empty input.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$GITHUB_SHA" \
            --jq .content | base64 -d | jq -er '."."')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Unexpected version in .release-please-manifest.json: '$version'"
            exit 1
          fi
          drafts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v$version\") | .id")"
          if [[ -n "$drafts" ]]; then
            echo "::warning::Draft release v$version is not published yet: release-please skipped"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.pending.outputs.draft != 'true'

  build:
    name: Build distribution 📦
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/diracx'
    runs-on: "ubuntu-latest"
    outputs:
      new-version: ${{ steps.check-tag.outputs.new-version }}
      create-release: ${{ steps.check-tag.outputs.create-release }}
    permissions:
      contents: read
    defaults:
      run:
        # We need extglob for REFERENCE_BRANCH substitution
        shell: bash -l -O extglob {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # setuptools_scm needs the release tag to compute the version.
          ref: ${{ github.event.release.tag_name || inputs.tag || '' }}
          token: ${{ github.token }}
          persist-credentials: false
      - run: |
          git fetch --prune --unshallow
          git config --global user.email "ci@diracgrid.org"
          git config --global user.name "DIRACGrid CI"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Installing dependencies
        run: |
          python -m pip install \
              build \
              python-dateutil \
              pytz \
              readme_renderer[md] \
              requests \
              setuptools_scm
      - name: Validate README for PyPI
        run: |
          python -m readme_renderer README.md -o /tmp/README.html
      - name: Extract version from tag
        id: check-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_CREATED: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -xeuo pipefail
          if [[ "$RELEASE_CREATED" == 'true' ]]; then
            # A manual dispatch accepts any ref; only publish a real release tag.
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]] || ! git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" >/dev/null; then
              echo "::error::$RELEASE_TAG is not a release tag on the checked-out commit"
              exit 1
            fi
            echo "Deploying release $RELEASE_TAG"
            echo "create-release=true" >> "$GITHUB_OUTPUT"
            echo "new-version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release, skipping publish"
            echo "create-release=false" >> "$GITHUB_OUTPUT"
            echo "new-version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        run: |
          for pkg_dir in $PWD/diracx-*; do
            echo "Building $pkg_dir"
            python -m build --outdir $PWD/dist $pkg_dir
          done
          # Also build the diracx metapackage
          python -m build --outdir $PWD/dist .
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Wheels and sdists: both are published to PyPI.
          name: diracx-dist
          path: dist/diracx*
          retention-days: 5

  # Only this job can get a PyPI token; the build above runs without it.
  publish:
    name: Publish distribution 📦 to PyPI
    needs: build
    if: needs.build.outputs.create-release == 'true'
    # One group per tag: a group keeps only one pending job, so a shared group
    # would cancel a queued publish of another version.
    concurrency:
      group: pypi-publish-${{ needs.build.outputs.new-version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diracx-dist
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package on PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Generate and upload PEP 740 attestations (build provenance) for the wheels.
          attestations: true
          # A re-publish after a partial upload must not fail on files already there.
          skip-existing: true

  docker:
    # Release images only after the wheels are on PyPI. publish is skipped on
    # non-release runs, so check results explicitly instead of the implicit success().
    needs:
      - build
      - publish
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.build.outputs.create-release != 'true') }}
    # Each push to main builds the :dev images: a newer push cancels the older
    # build, so an older commit cannot overwrite :dev. Releases are never cancelled.
    concurrency:
      group: docker-${{ needs.build.outputs.new-version || github.ref }}
      cancel-in-progress: ${{ needs.build.outputs.create-release != 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push images to ghcr.io
      id-token: write          # OIDC for sigstore signing of attestations
      attestations: write      # write build-provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The image build copies .git so hatch-vcs can compute the version:
          # release images need the tag, not the push commit.
          ref: ${{ needs.build.outputs.new-version || '' }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A re-publish (workflow_dispatch or re-run) only fills in what is missing:
      # an image already pushed for this tag is kept, not replaced by a new
      # build with another digest. A failed lookup counts as missing.
      - name: Check existing release images
        id: existing
        if: ${{ needs.build.outputs.create-release == 'true' }}
        env:
          TAG: ${{ needs.build.outputs.new-version }}
        run: |
          for img in services tasks client; do
            if docker buildx imagetools inspect "ghcr.io/diracgrid/diracx/$img:$TAG" >/dev/null 2>&1; then
              echo "::notice::ghcr.io/diracgrid/diracx/$img:$TAG already exists, not rebuilding it"
              echo "$img=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and push services (release)
        id: build-services-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ needs.build.outputs.create-release == 'true' && steps.existing.outputs.services != 'true' }}
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-services
          push: true
          tags: "ghcr.io/diracgrid/diracx/services:${{ needs.build.outputs.new-version }}"
          platforms: linux/amd64,linux/arm64
      - name: Attest services (release)
        if: ${{ needs.build.outputs.create-release == 'true' && steps.existing.outputs.services != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/diracgrid/diracx/services
          subject-digest: ${{ steps.build-services-release.outputs.digest }}
          push-to-registry: true
      - name: Build and push tasks (release)
        id: build-tasks-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ needs.build.outputs.create-release == 'true' && steps.existing.outputs.tasks != 'true' }}
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-tasks
          push: true
          tags: "ghcr.io/diracgrid/diracx/tasks:${{ needs.build.outputs.new-version }}"
          platforms: linux/amd64,linux/arm64
      - name: Attest tasks (release)
        if: ${{ needs.build.outputs.create-release == 'true' && steps.existing.outputs.tasks != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/diracgrid/diracx/tasks
          subject-digest: ${{ steps.build-tasks-release.outputs.digest }}
          push-to-registry: true
      - name: Build and push client (release)
        id: build-client-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ needs.build.outputs.create-release == 'true' && steps.existing.outputs.client != 'true' }}
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-client
          push: true
          tags: "ghcr.io/diracgrid/diracx/client:${{ needs.build.outputs.new-version }}"
          platforms: linux/amd64,linux/arm64
      - name: Attest client (release)
        if: ${{ needs.build.outputs.create-release == 'true' && steps.existing.outputs.client != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/diracgrid/diracx/client
          subject-digest: ${{ steps.build-client-release.outputs.digest }}
          push-to-registry: true

      - name: Build and push services (dev)
        if: ${{ needs.build.outputs.create-release != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-services
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.repository == 'DIRACGrid/diracx' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx/services:dev
          platforms: linux/amd64,linux/arm64
      - name: Build and push tasks (dev)
        if: ${{ needs.build.outputs.create-release != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-tasks
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.repository == 'DIRACGrid/diracx' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx/tasks:dev
          platforms: linux/amd64,linux/arm64
      - name: Build and push client (dev)
        if: ${{ needs.build.outputs.create-release != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: PIXI_ENV=container-client
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.repository == 'DIRACGrid/diracx' && github.ref_name == 'main' }}
          tags: ghcr.io/diracgrid/diracx/client:dev
          platforms: linux/amd64,linux/arm64
