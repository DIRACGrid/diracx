name: Integration Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions: {}

defaults:
  run:
    shell: bash -el {0}

jobs:
  resolve-deps:
    name: Resolve PR dependencies
    if: github.repository == 'DIRACGrid/diracx'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dirac-ref: ${{ steps.resolve.outputs.dirac-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Resolve Depends-On pull requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/resolve_pr_deps.py resolve --repo "$REPO" --pr "$PR_NUMBER"

  dirac-integration-tests:
    name: DIRAC Integration tests
    needs: resolve-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dirac-branch:
          - integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Clone DIRAC
        env:
          DIRAC_REF: ${{ needs.resolve-deps.outputs.dirac-ref || matrix.dirac-branch }}
        run: |
          pip install typer pyyaml gitpython packaging
          # Full clone as DIRAC takes its version from the git tags
          git clone https://github.com/DIRACGrid/DIRAC.git /tmp/DIRACRepo
          git -C /tmp/DIRACRepo fetch origin "$DIRAC_REF"
          git -C /tmp/DIRACRepo checkout -q FETCH_HEAD
          echo "Current revision: $(git -C /tmp/DIRACRepo rev-parse HEAD)"
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        if: needs.resolve-deps.outputs.dirac-ref != ''
        with:
          run-install: false
          post-cleanup: false
      - name: Use DIRACCommon from DIRAC dependency
        if: needs.resolve-deps.outputs.dirac-ref != ''
        run: .github/scripts/use-diraccommon-from-source.sh /tmp/DIRACRepo
      - name: Prepare environment
        run: cd /tmp/DIRACRepo && ./integration_tests.py prepare-environment "TEST_DIRACX=Yes" --diracx-src-dir "${GITHUB_WORKSPACE}"
      - name: Install server
        run:  cd /tmp/DIRACRepo && ./integration_tests.py install-server
      - name: Install client
        run: cd /tmp/DIRACRepo && ./integration_tests.py install-client
      - name: Install pilot
        run: cd /tmp/DIRACRepo && ./integration_tests.py install-pilot
      - name: Server tests
        run: cd /tmp/DIRACRepo && ./integration_tests.py test-server || touch server-tests-failed
      - name: Client tests
        run: cd /tmp/DIRACRepo && ./integration_tests.py test-client || touch client-tests-failed
      - name: Pilot tests
        run: cd /tmp/DIRACRepo && ./integration_tests.py test-pilot || touch pilot-tests-failed
      - name: Check test status
        run: |
          has_error=0
          # TODO: set has_error=1 when we are ready to really run the tests
          if [ -f server-tests-failed ]; then has_error=1; echo "Server tests failed"; fi
          if [ -f client-tests-failed ]; then has_error=1; echo "Client tests failed"; fi
          if [ -f pilot-tests-failed ]; then has_error=1; echo "Pilot tests failed"; fi
          if [ ${has_error} = 1 ]; then exit 1; fi
      - name: Debugging information
        if: always()
        run: |
          mkdir -p /tmp/service-logs

          echo "::group::Container status"
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"
          echo "::endgroup::"

          DIRACX_CONTAINERS="diracx diracx-init-keystore diracx-init-cs diracx-init-db diracx-chmod"

          for container in $DIRACX_CONTAINERS; do
            if docker inspect "$container" &>/dev/null; then
              echo "::group::Logs: $container"
              docker logs "$container" 2>&1 | tee -a /tmp/service-logs/diracx.log
              echo "::endgroup::"
            fi
          done

          echo "::group::DiracX API request summary"
          docker logs diracx 2>/dev/null | grep '/api/' \
            | awk -F\" '{print $2, $3}' \
            | awk '{print $1, $2, $4}' \
            | sort | uniq -c | sort || true
          echo "::endgroup::"

          echo "::group::DIRAC server logs"
          cd /tmp/DIRACRepo && ./integration_tests.py logs --no-follow --lines 1000 2>&1 | tee /tmp/service-logs/dirac.log || true
          echo "::endgroup::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: service-logs-${{ github.job }}
          path: /tmp/service-logs/
