name: Basic Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DIRACX_CHARTS_REPOSITORY: https://github.com/DIRACGrid/diracx-charts.git
  DIRACX_CHARTS_BRANCH: master

jobs:
  resolve-deps:
    name: Resolve PR dependencies
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      charts-ref: ${{ steps.resolve.outputs.charts-ref }}
      dirac-ref: ${{ steps.resolve.outputs.dirac-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Resolve Depends-On pull requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/resolve_pr_deps.py resolve --repo "$REPO" --pr "$PR_NUMBER"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
          post-cleanup: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          environments: shellcheck
      - name: Run shellcheck
        run: pixi run shellcheck

  workgraph-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
          post-cleanup: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          environments: workgraph-sim
      - name: Run the workgraph simulator checks
        run: pixi run test-workgraph-sim

  unittest:
    name: Unit test - ${{ matrix.package }}
    needs: resolve-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - diracx-core
          - diracx-db
          - diracx-logic
          - diracx-routers
          - diracx-client
          - diracx-api
          - diracx-cli
          - gubbins-core
          - gubbins-db
          - gubbins-logic
          - gubbins-routers
          - gubbins-client
          - gubbins-api
          - gubbins-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
          post-cleanup: false
      - name: Apply workarounds
        run: |
          # Workaround for https://github.com/prefix-dev/pixi/issues/3762
          sed -i.bak 's@editable = true@editable = false@g' pixi.toml
          rm pixi.toml.bak
          # Show any changes
          git diff
      - name: Checkout DIRAC dependency
        if: needs.resolve-deps.outputs.dirac-ref != ''
        env:
          DIRAC_REF: ${{ needs.resolve-deps.outputs.dirac-ref }}
        run: |
          git init -q ../DIRAC
          git -C ../DIRAC fetch --depth 1 https://github.com/DIRACGrid/DIRAC.git "$DIRAC_REF"
          git -C ../DIRAC checkout -q FETCH_HEAD
      - name: Use DIRACCommon from DIRAC dependency
        if: needs.resolve-deps.outputs.dirac-ref != ''
        run: .github/scripts/use-diraccommon-from-source.sh ../DIRAC
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          environments: ${{ matrix.package }}
      - name: Run pytest
        run: pixi run pytest-${{ matrix.package }} --cov-report=xml:coverage.xml --junitxml=report.xml
      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  pytest-sql-servers:
    name: Unit test - diracx-db on MySQL and MariaDB
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_ROOT_PASSWORD: diracx
          MYSQL_DATABASE: transformation
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdiracx"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
        env:
          MARIADB_ROOT_PASSWORD: diracx
          MARIADB_DATABASE: transformation
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          run-install: false
          post-cleanup: false
      - name: Apply workarounds
        run: |
          # Workaround for https://github.com/prefix-dev/pixi/issues/3762
          sed -i.bak 's@editable = true@editable = false@g' pixi.toml
          rm pixi.toml.bak
          # Show any changes
          git diff
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          cache: false
          environments: diracx-db
      - name: Run pytest
        # The transformation tests run on SQLite, then again on each server
        env:
          DIRACX_TEST_MYSQL_URL: mysql+aiomysql://root:diracx@127.0.0.1:3306/transformation
          DIRACX_TEST_MARIADB_URL: mysql+aiomysql://root:diracx@127.0.0.1:3307/transformation
        run: pixi run pytest-diracx-db tests/transformation --no-cov

  pytest-integration:
    needs: resolve-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension:
          - diracx
          - gubbins
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          # remove .NET SDKs
          sudo rm -rf /usr/share/dotnet || true
          # remove Android SDK
          sudo rm -rf usr/local/lib/android || true
          # remove Haskell Compiler
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true

          sudo apt-get clean || echo "::warning::The command [sudo apt-get clean] failed to complete successfully. Proceeding..."

          # prune docker
          docker system prune -af || true

          echo "After cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
          post-cleanup: false
      - name: Apply workarounds
        run: |
          # Workaround for https://github.com/prefix-dev/pixi/issues/3762
          sed -i.bak 's@editable = true@editable = false@g' pixi.toml
          rm pixi.toml.bak
          # Show any changes
          git diff
      - name: Checkout DIRAC dependency
        if: needs.resolve-deps.outputs.dirac-ref != ''
        env:
          DIRAC_REF: ${{ needs.resolve-deps.outputs.dirac-ref }}
        run: |
          git init -q ../DIRAC
          git -C ../DIRAC fetch --depth 1 https://github.com/DIRACGrid/DIRAC.git "$DIRAC_REF"
          git -C ../DIRAC checkout -q FETCH_HEAD
      - name: Use DIRACCommon from DIRAC dependency
        if: needs.resolve-deps.outputs.dirac-ref != ''
        run: .github/scripts/use-diraccommon-from-source.sh ../DIRAC
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          environments: ${{ matrix.extension == 'diracx' && 'default' || 'default-gubbins' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build services image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: |
            PIXI_ENV=${{ matrix.extension == 'diracx' && 'container-services' || 'gubbins-container-services' }}
          tags: ghcr.io/${{ matrix.extension == 'diracx' && 'diracgrid/diracx' || 'gubbins' }}/services:dev
          outputs: type=docker,dest=/tmp/services_image.tar
      - name: Build tasks image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: |
            PIXI_ENV=${{ matrix.extension == 'diracx' && 'container-tasks' || 'gubbins-container-tasks' }}
          tags: ghcr.io/${{ matrix.extension == 'diracx' && 'diracgrid/diracx' || 'gubbins' }}/tasks:dev
          outputs: type=docker,dest=/tmp/tasks_image.tar
      - name: Build client image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          build-args: |
            PIXI_ENV=${{ matrix.extension == 'diracx' && 'container-client' || 'gubbins-container-client' }}
          tags: ghcr.io/${{ matrix.extension == 'diracx' && 'diracgrid/diracx' || 'gubbins' }}/client:dev
          outputs: type=docker,dest=/tmp/client_image.tar
      - name: Load images
        run: |
          docker load --input /tmp/services_image.tar
          rm -f /tmp/services_image.tar
          docker load --input /tmp/tasks_image.tar
          rm -f /tmp/tasks_image.tar
          docker load --input /tmp/client_image.tar
          rm -f /tmp/client_image.tar
          docker builder prune -af || true
          docker image ls -a
      - name: Start demo
        env:
          CHARTS_REF: ${{ needs.resolve-deps.outputs.charts-ref }}
        run: |
          git init -q ../diracx-charts
          git -C ../diracx-charts fetch "$DIRACX_CHARTS_REPOSITORY" "${CHARTS_REF:-$DIRACX_CHARTS_BRANCH}"
          git -C ../diracx-charts checkout -q FETCH_HEAD

          declare -a demo_args=()
          demo_args+=("--enable-open-telemetry")
          demo_args+=("--enable-coverage")
          demo_args+=("--exit-when-done")
          demo_args+=("--ci-values" "../diracx-charts/demo/ci_values.yaml")

          # Download helm/kubectl/kind first
          ../diracx-charts/run_demo.sh --only-download-deps

          if [ ${{ matrix.extension }} == 'gubbins' ]; then
            demo_args+=("--set-value" "diracx.developer.autoReload=false")

            # Copy gubbins-charts to a temporary location and build dependencies
            cp -r ./extensions/gubbins-charts /tmp/
            ../diracx-charts/.demo/helm dependency build /tmp/gubbins-charts
            # Replace the downloaded subchart with the locally-cloned one to
            # ensure we have the pixi-compatible ConfigMap entrypoint
            rm -f /tmp/gubbins-charts/charts/diracx-*.tgz
            ../diracx-charts/.demo/helm package ../diracx-charts/diracx -d /tmp/gubbins-charts/charts/

            demo_args+=("--extension-chart-path" "/tmp/gubbins-charts")
            demo_args+=("--ci-values" "./extensions/gubbins_values.yaml")
            demo_args+=("--load-docker-image" "ghcr.io/gubbins/services:dev")
            demo_args+=("--load-docker-image" "ghcr.io/gubbins/tasks:dev")
            demo_args+=("--load-docker-image" "ghcr.io/gubbins/client:dev")
            demo_args+=("--prune-loaded-images")
          elif [ ${{ matrix.extension }} != 'diracx' ]; then
            echo "Unknown extension: ${{ matrix.extension }}"
            exit 1
          else
            demo_args+=("--set-value" "developer.autoReload=false")
            demo_args+=("--set-value" "global.imagePullPolicy=IfNotPresent")
            demo_args+=("--load-docker-image" "ghcr.io/diracgrid/diracx/services:dev")
            demo_args+=("--load-docker-image" "ghcr.io/diracgrid/diracx/tasks:dev")
            demo_args+=("--load-docker-image" "ghcr.io/diracgrid/diracx/client:dev")
            demo_args+=("--prune-loaded-images")
          fi

          # Run the demo with the provided arguments
          set -x
          ../diracx-charts/run_demo.sh "${demo_args[@]}"
      - name: Debugging information
        if: always()
        run: .github/scripts/collect-k8s-debug-info.sh "$PWD/../diracx-charts/.demo" "${{ matrix.extension == 'gubbins' && 'gubbins' || 'diracx' }}"
      - name: Run pytest
        run: |
          pixi run pytest-${{ matrix.extension }} --demo-dir="$PWD/../diracx-charts/" --cov-report=xml:coverage-pytest.xml --junitxml=report.xml
      - name: Collect demo coverage
        run: |
          pixi run -e ${{ matrix.extension == 'diracx' && 'default' || 'default-gubbins' }} python -m diracx.testing coverage collect-demo --demo-dir=../diracx-charts/.demo
      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage-pytest.xml,./coverage-demo.xml

  client-generation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [diracx, gubbins]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
          post-cleanup: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          locked: false
          environments: ${{ matrix.package }}-generate-client
      - name: Run autorest
        run: pixi run -e ${{ matrix.package }}-generate-client generate-client

  pre-commit:
    # Runs the hooks listed in ``ci.skip`` of .pre-commit-config.yaml — those
    # are the hooks that require a pixi environment and therefore can't run on
    # pre-commit.ci. All other hooks are handled by the pre-commit.ci bot.
    name: pre-commit (pixi-dependent hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
          post-cleanup: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: false
          environments: pre-commit
      - name: Run pixi-dependent pre-commit hooks
        run: |
          for hook in generate-pixi-docs settings-doc-check check-all-required check-all-forbidden; do
            pixi run pre-commit run "$hook" --all-files
          done
