on:
  push:
    branches:
      - main

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          release-type: simple

  release-env:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      RELEASE_UPLOAD_URL: ${{ needs.release-please.outputs.upload_url }}
    steps:
      - name: Checkout exact DIRACX release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve current canonical charts commit
        id: charts
        shell: bash
        run: |
          refs="$(git ls-remote --exit-code https://github.com/DIRACGrid/diracx-charts.git refs/heads/master)" || exit 1
          ref_pattern=$'^([0-9a-f]{40})\trefs/heads/master$'
          if [[ "$refs" =~ $ref_pattern ]]; then
            charts_sha="${BASH_REMATCH[1]}"
          else
            echo 'Expected one canonical diracx-charts master commit' >&2
            exit 1
          fi
          echo "sha=$charts_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact diracx-charts commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DIRACGrid/diracx-charts
          ref: ${{ steps.charts.outputs.sha }}
          path: diracx-charts
          persist-credentials: false
      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
          CHARTS_SHA: ${{ steps.charts.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git -C diracx-charts rev-parse HEAD)" = "$CHARTS_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .upload_url)" = "$RELEASE_UPLOAD_URL"
      - name: Generate and validate public example
        env:
          CHARTS_SHA: ${{ steps.charts.outputs.sha }}
        run: |
          python3 scripts/generate_release_env.py \
            --charts-root diracx-charts --release-tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_SHA" --charts-commit "$CHARTS_SHA" \
            --output .env
          python3 scripts/generate_release_env.py \
            --charts-root diracx-charts --release-tag "$RELEASE_TAG" \
            --source-commit "$RELEASE_SHA" --charts-commit "$CHARTS_SHA" \
            --output .env --validate
      - name: Upload validated release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq diracx.env; then
            echo 'diracx.env already exists on this release' >&2
            exit 1
          fi
          cp .env diracx.env
          cmp .env diracx.env
          gh release upload "$RELEASE_TAG" diracx.env
