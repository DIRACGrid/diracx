[project]
name = "diracx-testing"
description = "TODO"
readme = "README.md"
requires-python = ">=3.11"
keywords = []
license = {text = "GPL-3.0-only"}
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pytest",
    "pytest-asyncio>=1.1.0",
    "pytest-cov",
    "pytest-lazy-fixtures",
    "pytest-xdist",
    "httpx2",
    "joserfc",
    "freezegun",
    "sqlalchemy",
    "uuid-utils<1.0.0", # Breaking changes in the API https://github.com/aminalaee/uuid-utils/releases/tag/1.0.0
    "pytest-github-actions-annotate-failures",
    # For the minimal OpenTelemetry collector (diracx.testing.otel_printer)
    "grpcio",
    "opentelemetry-proto",
    # For the in-memory providers of the tests (diracx.testing.otel)
    "opentelemetry-sdk",
]
dynamic = ["version"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel]
packages = ["src/diracx"]
